<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candidatos a Líder · Juventude Livre RJ</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mut:#6b6a64;--bd:#e2e0d8;--ac:#d97706;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--tx:#f0efe9;--mut:#a3a199;--bd:#37362f;--ac:#f59e0b;--acx:#161614}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--tx:#f0efe9;--mut:#a3a199;--bd:#37362f;--ac:#f59e0b;--acx:#161614}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
.bar input{flex:1;min-width:160px;width:auto}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cover{aspect-ratio:16/10;background:linear-gradient(135deg,var(--ac),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.4rem;font-weight:700;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:12px 14px}
.cb h3{margin:0 0 4px;font-size:1.05rem}
.cb p{margin:0;color:var(--mut);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--mut);padding:50px 10px;border:2px dashed var(--bd);border-radius:14px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);width:min(640px,94vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.in{padding:18px;overflow:auto;max-height:90vh}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
textarea{min-height:200px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.prev{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:block}
.read h2{margin:12px 0 8px}
.read .txt{white-space:pre-wrap;font-size:1.02rem}
.read img{width:100%;border-radius:12px;display:block}
.warn{color:#c0392b;font-size:.85rem;margin-top:8px}
.chapa{color:var(--ac);font-size:.85rem;font-weight:600;margin:0 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Candidatos a Líder · RJ</h1>
  <p class="sub">Juventude Livre — organize as ideias de cada candidato em um só lugar.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar por nome ou texto…">
    <button class="p" id="add">+ Novo candidato</button>
    <button id="exp" title="Baixar cópia de segurança">Exportar</button>
    <button id="imp" title="Restaurar cópia">Importar</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <div id="warn" class="warn" hidden></div>
  <div id="list" class="grid"></div>
</div>

<dialog id="dform"><div class="in">
  <h2 id="ftitle" style="margin:0">Novo candidato</h2>
  <label for="nome">Nome</label>
  <input id="nome" maxlength="80" placeholder="Nome do candidato">
  <label for="chapa">Nome da chapa</label>
  <input id="chapa" maxlength="80" placeholder="Ex.: Chapa Renovação (opcional)">
  <label for="capa">Capa visual (imagem)</label>
  <input id="capa" type="file" accept="image/*">
  <img id="prev" class="prev" alt="" hidden>
  <label for="texto">Texto do candidato</label>
  <textarea id="texto" placeholder="Cole aqui a carta, proposta ou ideias do candidato…"></textarea>
  <div class="row">
    <button class="d" id="del" hidden>Excluir</button>
    <button id="cancel">Cancelar</button>
    <button class="p" id="save">Salvar</button>
  </div>
</div></dialog>

<dialog id="dpin"><div class="in">
  <h2 style="margin:0 0 8px">Digite o PIN</h2>
  <p class="sub">Necessário para adicionar ou modificar.</p>
  <input id="pin" type="password" autocomplete="off" placeholder="PIN">
  <div id="perr" class="warn" hidden>PIN incorreto.</div>
  <div class="row"><button id="pcancel">Cancelar</button><button class="p" id="pok">Entrar</button></div>
</div></dialog>

<dialog id="dread"><div class="in read">
  <div id="rbody"></div>
  <div class="row">
    <button id="redit">Editar</button>
    <button class="p" id="rclose">Fechar</button>
  </div>
</div></dialog>

<script>
(function(){
  var KEY='candidatos-juventude-livre-rj';
  var items=[], editId=null, cover='';
  var $=function(i){return document.getElementById(i)};
  function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(items));$('warn').hidden=true}
    catch(e){$('warn').hidden=false;$('warn').textContent='Não foi possível salvar neste navegador. Use “Exportar” para guardar uma cópia.'}
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(){
    var q=$('q').value.toLowerCase().trim();
    var r=items.filter(function(c){return !q||(c.nome+' '+(c.chapa||'')+' '+c.texto).toLowerCase().indexOf(q)>-1});
    var el=$('list');
    if(!r.length){
      el.innerHTML='<div class="empty" style="grid-column:1/-1">'+(items.length?'Nenhum resultado.':'Nenhum candidato ainda. Clique em “+ Novo candidato” para começar.')+'</div>';
      return;
    }
    el.innerHTML=r.map(function(c){
      var cv=c.capa?'<img src="'+c.capa+'" alt="">':esc((c.nome||'?').trim().charAt(0).toUpperCase());
      return '<div class="card" data-id="'+c.id+'"><div class="cover">'+cv+'</div><div class="cb"><h3>'+esc(c.nome)+'</h3>'+(c.chapa?'<div class="chapa">Chapa: '+esc(c.chapa)+'</div>':'')+'<p>'+esc(c.texto||'Sem texto ainda.')+'</p></div></div>';
    }).join('');
  }
  function openForm(id){
    editId=id||null;
    var c=items.find(function(x){return x.id===id})||{nome:'',texto:'',capa:''};
    $('ftitle').textContent=id?'Editar candidato':'Novo candidato';
    $('nome').value=c.nome;$('chapa').value=c.chapa||'';$('texto').value=c.texto;$('capa').value='';
    cover=c.capa||'';
    $('prev').hidden=!cover;if(cover)$('prev').src=cover;
    $('del').hidden=!id;
    $('dform').showModal();
  }
  function openRead(id){
    var c=items.find(function(x){return x.id===id});if(!c)return;
    editId=id;
    $('rbody').innerHTML=(c.capa?'<img src="'+c.capa+'" alt="">':'')+'<h2>'+esc(c.nome)+'</h2>'+(c.chapa?'<div class="chapa">Chapa: '+esc(c.chapa)+'</div>':'')+'<div class="txt">'+esc(c.texto||'Sem texto ainda.')+'</div>';
    $('dread').showModal();
  }
  function resize(file,cb){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var m=900,s=Math.min(1,m/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        cb(cv.toDataURL('image/jpeg',.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  var unlocked=false,pinCb=null;
  function guard(cb){
    if(unlocked){cb();return}
    pinCb=cb;$('pin').value='';$('perr').hidden=true;$('dpin').showModal();$('pin').focus();
  }
  $('pok').onclick=function(){
    if($('pin').value==='Kayth123'){unlocked=true;$('dpin').close();var f=pinCb;pinCb=null;if(f)f()}
    else{$('perr').hidden=false}
  };
  $('pcancel').onclick=function(){$('dpin').close()};
  $('pin').onkeydown=function(e){if(e.key==='Enter')$('pok').click()};
  $('add').onclick=function(){guard(function(){openForm()})};
  $('q').oninput=render;
  $('cancel').onclick=function(){$('dform').close()};
  $('capa').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    resize(f,function(d){cover=d;$('prev').src=d;$('prev').hidden=false});
  };
  $('save').onclick=function(){
    var nome=$('nome').value.trim();
    if(!nome){$('nome').focus();return}
    var o={nome:nome,chapa:$('chapa').value.trim(),texto:$('texto').value,capa:cover};
    if(editId){var c=items.find(function(x){return x.id===editId});Object.assign(c,o)}
    else{o.id=String(Date.now());items.push(o)}
    persist();render();$('dform').close();
  };
  $('del').onclick=function(){
    if(!confirm('Excluir este candidato?'))return;
    items=items.filter(function(x){return x.id!==editId});
    persist();render();$('dform').close();
  };
  $('list').onclick=function(e){
    var c=e.target.closest('.card');if(c)openRead(c.dataset.id);
  };
  $('rclose').onclick=function(){$('dread').close()};
  $('redit').onclick=function(){var id=editId;$('dread').close();guard(function(){openForm(id)})};
  $('exp').onclick=function(){
    var b=new Blob([JSON.stringify(items)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='candidatos-rj.json';a.click();
  };
  $('imp').onclick=function(){guard(function(){$('file').click()})};
  $('file').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{var d=JSON.parse(fr.result);if(Array.isArray(d)){items=d;persist();render()}}
      catch(x){alert('Arquivo inválido.')}
    };
    fr.readAsText(f);
  };
  load();render();
})();
</script>
</body>
</html>
